name: Verify and build ssok

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this verified revision to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ssok-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: tools/ci/requirements-lock.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain/downloads
          key: godot-4.7.2-linux-editor-cadd3204
      - run: python tools/ci/install_godot.py
      - run: python -m pip install -r tools/ci/requirements-lock.txt
      - name: Run all checks, including mock HTTP and MCP transport
        run: python tools/ci/verify.py --godot "$PWD/build/toolchain/godot"
      - name: Preserve every result and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.sha }}
          path: build/verification/
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: test ! -f build/verification/SUMMARY.md || cat build/verification/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain/downloads
          key: godot-4.7.2-linux-and-templates-f298490b
      - run: python tools/ci/install_godot.py --templates
      - name: Export and audit both platforms
        id: export
        env:
          BUILD_VERSION: ${{ github.event_name == 'release' && github.ref_name || github.sha }}
        run: python tools/ci/build.py --godot "$PWD/build/toolchain/godot" --version "$BUILD_VERSION"
      - name: Install the pinned browser test environment
        id: browser_setup
        run: |
          python -m pip install -r tools/ci/requirements-lock.txt
          python -m playwright install --with-deps chromium
      - name: Exercise the exported WebGL application
        if: ${{ !cancelled() && steps.export.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: timeout --signal=INT --kill-after=20s 10m python tools/ci/browser_smoke.py
      - name: Verify browser project persistence and import safety
        if: ${{ !cancelled() && steps.export.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: timeout --signal=INT --kill-after=20s 10m python tools/ci/browser_authoring.py
      - name: Measure real WebAssembly learned walking and stopping
        if: ${{ !cancelled() && steps.export.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: timeout --signal=INT --kill-after=20s 10m python tools/ci/browser_physics.py
      - name: Retain real browser screenshots and console output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ github.sha }}
          path: |
            build/browser-smoke/
            build/browser-authoring/
            build/browser-physics/
          if-no-files-found: warn
      - name: Save downloadable builds and manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssok-release-${{ github.sha }}
          path: |
            build/ssok-*.zip
            build/SHA256SUMS
            build/release.json
            build/export-logs/
          if-no-files-found: error
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  pages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ssok-release-${{ github.sha }}
          path: artifacts
      - name: Attach verified binaries to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/ssok-*.zip artifacts/SHA256SUMS artifacts/release.json
